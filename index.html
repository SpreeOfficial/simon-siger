<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simon Siger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: fullscreen spejlet kamera med kommando-banner øverst og score nederst */
:root{
  --bg:#14121f; --fg:#f6f3ff; --simon:#ffc83d; --trap:#ff5d73; --ok:#3ddc97; --muted:#a49fbf;
  --display:"Baloo 2",system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--bg),transparent);text-align:center}
#cmd{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,3.4rem);line-height:1.05;margin:0;text-wrap:balance}
#cmd .s{color:var(--simon)}
#timer{height:8px;border-radius:4px;background:#ffffff22;margin:10px auto 0;max-width:420px;overflow:hidden}
#timer i{display:block;height:100%;width:0;background:var(--simon)}
#active{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
#active span{font:600 1rem var(--body);background:#ffc83d26;border:2px solid var(--simon);border-radius:999px;padding:4px 12px}
#active span.off{border-color:var(--trap);background:#ff5d7326}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:end;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,var(--bg));font-family:var(--display);font-size:1.6rem;font-weight:800}
#lives{color:var(--trap);letter-spacing:.1em}
#live{font:600 .95rem var(--body);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
#flash{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 16px;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,10vw,5.5rem);line-height:1.05;pointer-events:none;opacity:0;transition:opacity .2s;text-shadow:0 4px 24px #000a}
#flash.show{opacity:1}
#menu{position:absolute;inset:0;display:grid;place-items:center;background:#14121fe6;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
#menu>div{max-width:30rem;text-align:center;display:grid;gap:14px}
#menu h1{font-family:var(--display);font-size:clamp(2.6rem,11vw,4.5rem);margin:0;line-height:1;color:var(--simon)}
#menu p{margin:0;color:var(--muted);line-height:1.5}
#mistakes{margin:0;padding:14px 18px 14px 40px;text-align:left;background:#ff5d731f;border:2px solid var(--trap);border-radius:16px;display:grid;gap:8px;line-height:1.35}
#mistakes::before{content:attr(data-h);font:800 1.2rem var(--display);color:var(--trap);margin-left:-22px}
#mistakes b{color:var(--fg)}
#mistakes span{color:var(--muted);display:block;font-size:.9rem}
.lang{display:flex;gap:6px;justify-content:center}
.lang button{font:600 .95rem var(--body);padding:6px 16px;background:transparent;color:var(--muted);border:2px solid var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.modes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
button{font:800 1.4rem var(--display);background:var(--simon);color:#231a00;border:0;border-radius:999px;padding:12px 30px;cursor:pointer}
button.hard{background:var(--trap);color:#2a0008}
button small{display:block;font:600 .8rem var(--body)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
  <div id="top"><p id="cmd">Gør dig klar…</p><div id="timer"><i id="bar"></i></div><div id="active"></div></div>
  <div id="flash"></div>
  <div id="bottom"><span id="score">0 point</span><span id="live"></span><span id="lives">♥♥♥</span></div>
  <div id="menu"><div>
    <div class="lang"><button id="lda" data-l="da">Dansk</button><button id="len" data-l="en">English</button></div>
    <h1 id="mtitle">Simon Siger</h1>
    <p id="intro">Stil telefonen op, og gå 2–3 meter tilbage, så hele kroppen er med. Gør kun det, der bliver sagt, når det starter med <b style="color:var(--simon)">Simon siger</b>.</p>
    <div class="modes">
      <button id="normal" disabled><span id="bn">Normal</span><small id="bns">Én ting ad gangen</small></button>
      <button id="hard" class="hard" disabled><span id="bh">Svær</span><small id="bhs">Bliv ved, til Simon siger stop</small></button>
    </div>
    <ol id="mistakes" data-h="Det gik galt her:" hidden></ol>
    <p id="msg">Indlæser…</p>
  </div></div>
</div>

<script type="module">
import {PoseLandmarker,FilesetResolver,DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $=id=>document.getElementById(id);
const v=$("v"),c=$("c"),ctx=c.getContext("2d");
let pose,lm=null;
/* ---------- Sprog ---------- */
const T={
 da:{simon:"Simon siger: ",title:"Simon Siger",intro:'Stil telefonen op, og gå 2–3 meter tilbage, så hele kroppen er med. Gør kun det, der bliver sagt, når det starter med <b style="color:var(--simon)">Simon siger</b>.',
   normal:"Normal",normalSub:"Én ting ad gangen",hard:"Svær",hardSub:"Bliv ved, til Simon siger stop",loading:"Indlæser…",
   modelErr:"Kunne ikke indlæse AI-modellen. Tjek internetforbindelsen.",camErr:"Kameraet blev ikke tilladt. Siden skal åbnes via https, og du skal give adgang til kameraet.",
   ready:"Gør dig klar. Gå to meter tilbage.",hardIntro:"Svær. Bliv ved med bevægelsen, til Simon siger stop. Gå to meter tilbage.",
   readyShort:"Gør dig klar…",twice:" to gange",stop:x=>"stop med at "+x,good:"Godt!",held:"Godt holdt!",notSimon:"Simon sagde det ikke!",slow:"For langsom!",
   notStop:"Simon sagde ikke stop!",stopped:x=>"Du stoppede med at "+x+"!",shouldStop:x=>"Du skulle stoppe med at "+x+"!",praise:["Godt!","Flot!","Bliv ved!"],
   restart:" Vi starter forfra.",over:n=>"Spillet er slut. Du fik "+n+" point.",overShort:"Spillet er slut",got:n=>"Du fik "+n+" point.",points:n=>n+" point",
   also:"Du var i gang med: ",mistakesHead:"Det gik galt her:",live:(h,k,s)=>`Hop ${h} · Klap ${k} · Knæ ${s}`,noSee:"Kan ikke se dig",speech:"da-DK"},
 en:{simon:"Simon says: ",title:"Simon Says",intro:'Prop the phone up and step 2–3 meters back so your whole body is in view. Only do what you hear when it starts with <b style="color:var(--simon)">Simon says</b>.',
   normal:"Normal",normalSub:"One thing at a time",hard:"Hard",hardSub:"Keep going until Simon says stop",loading:"Loading…",
   modelErr:"Could not load the AI model. Check your internet connection.",camErr:"Camera access was not allowed. The page must be opened over https, and you need to allow the camera.",
   ready:"Get ready. Step two meters back.",hardIntro:"Hard. Keep doing each move until Simon says stop. Step two meters back.",
   readyShort:"Get ready…",twice:" twice",stop:x=>"stop "+x,good:"Good!",held:"Nice hold!",notSimon:"Simon didn't say so!",slow:"Too slow!",
   notStop:"Simon didn't say stop!",stopped:x=>"You stopped "+x+"!",shouldStop:x=>"You should have stopped "+x+"!",praise:["Good!","Nice!","Keep going!"],
   restart:" Starting over.",over:n=>"Game over. You got "+n+" points.",overShort:"Game over",got:n=>"You got "+n+(n===1?" point.":" points."),points:n=>n+(n===1?" point":" points"),
   also:"You were doing: ",mistakesHead:"What went wrong:",live:(h,k,s)=>`Jumps ${h} · Claps ${k} · Squat ${s}`,noSee:"Can't see you",speech:"en-US"}
};
let lang="da";
try{const s=localStorage.getItem("simonLang");if(s==="en"||s==="da")lang=s;else if(!(navigator.language||"").toLowerCase().startsWith("da"))lang="en";}catch{}
const L=()=>T[lang];
const mt=m=>lang==="en"?m.te:m.t, ms=m=>lang==="en"?m.se:m.stop;
let modelReady=false;
function applyLang(){
  document.documentElement.lang=lang;document.title=L().title;
  $("mtitle").textContent=L().title;$("intro").innerHTML=L().intro;
  $("bn").textContent=L().normal;$("bns").textContent=L().normalSub;$("bh").textContent=L().hard;$("bhs").textContent=L().hardSub;
  $("mistakes").dataset.h=L().mistakesHead;$("cmd").textContent=L().readyShort;
  if(!modelReady&&!$("msg").dataset.err)$("msg").textContent=L().loading;
  $("lda").setAttribute("aria-pressed",lang==="da");$("len").setAttribute("aria-pressed",lang==="en");
  upd();pickVoice();
}
for(const b of document.querySelectorAll(".lang button"))b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("simonLang",lang);}catch{}$("mistakes").hidden=true;applyLang();if(typeof loadClips==="function")loadClips();};

/* ---------- Bevægelser ----------
   Landmarks: 0 næse, 11/12 skuldre, 15/16 håndled, 23/24 hofter, 25/26 knæ, 27/28 ankler */
const vis=(...i)=>i.every(k=>lm[k]&&lm[k].visibility>0.5);
const seen=(th,...i)=>i.every(k=>lm[k]&&lm[k].visibility>th);
// Vinkel i knæet (hofte-knæ-ankel) i grader. Uafhængig af hvor langt væk man står.
function kneeAngle(h,k,a){const v1=[lm[h].x-lm[k].x,lm[h].y-lm[k].y],v2=[lm[a].x-lm[k].x,lm[a].y-lm[k].y];
  return Math.acos(Math.max(-1,Math.min(1,(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2)||1))))*180/Math.PI;}
function squatOk(){
  if(seen(0.3,23,24,25,26,27,28))return (kneeAngle(23,25,27)+kneeAngle(24,26,28))/2<130;
  // Fødderne er ikke med i billedet: hofterne skal være næsten nede i knæhøjde i forhold til lårlængden
  if(!seen(0.3,11,12,23,24,25,26))return false;
  const torso=Math.abs((lm[23].y+lm[24].y)/2-(lm[11].y+lm[12].y)/2)||0.2;
  return ((lm[25].y-lm[23].y)+(lm[26].y-lm[24].y))/2<torso*0.45;
}
const up=w=>lm[w].y<lm[0].y;
const MOVES=[
  {id:"up2", cat:"arm", t:"ræk begge hænder op", stop:"holde hænderne oppe", te:"raise both hands", se:"holding your hands up", ok:()=>vis(0,15,16)&&up(15)&&up(16)},
  {id:"upR", cat:"arm", t:"ræk højre hånd op", stop:"holde højre hånd oppe", te:"raise your right hand", se:"holding your right hand up", ok:()=>vis(0,15,16)&&up(16)&&!up(15)},
  {id:"upL", cat:"arm", t:"ræk venstre hånd op", stop:"holde venstre hånd oppe", te:"raise your left hand", se:"holding your left hand up", ok:()=>vis(0,15,16)&&up(15)&&!up(16)},
  {id:"tee", cat:"arm", t:"stræk armene ud til siden", stop:"holde armene ude", te:"stretch your arms out to the sides", se:"holding your arms out", ok:()=>{if(!vis(11,12,15,16))return false;
     const sw=Math.abs(lm[11].x-lm[12].x);
     return Math.abs(lm[15].y-lm[11].y)<0.1&&Math.abs(lm[16].y-lm[12].y)<0.1&&Math.abs(lm[15].x-lm[16].x)>sw*2.5}},
  {id:"head",cat:"arm", t:"læg hænderne på hovedet", stop:"holde hænderne på hovedet", te:"put your hands on your head", se:"holding your hands on your head", ok:()=>vis(0,15,16)&&[15,16].every(w=>Math.hypot(lm[w].x-lm[0].x,lm[w].y-lm[0].y)<0.18&&lm[w].y<lm[11].y)},
  {id:"clap",cat:"arm", act:true, t:"klap i hænderne", stop:"klappe", te:"clap your hands", se:"clapping"},
  {id:"squat",cat:"leg",t:"gå ned i knæ", stop:"være nede i knæ", te:"squat down", se:"squatting", ok:squatOk},
  {id:"one", cat:"stance", t:"stå på ét ben", stop:"stå på ét ben", te:"stand on one leg", se:"standing on one leg", ok:()=>vis(27,28)&&Math.abs(lm[27].y-lm[28].y)>0.07},
  {id:"hop", cat:"hop", act:true, t:"hop", stop:"hoppe", te:"jump", se:"jumping"},
];
const M=Object.fromEntries(MOVES.map(m=>[m.id,m]));
// To bevægelser kan ikke laves samtidig, hvis de bruger samme kropsdel (fx squat + hop)
// Undtagelse: klap + begge arme over hovedet kan godt laves samtidig (klap over hovedet)
const combo=(a,b)=>(a.id==="clap"&&b.id==="up2")||(a.id==="up2"&&b.id==="clap");
const conflict=(a,b)=>!combo(a,b)&&(a.cat===b.cat||(a.cat==="leg"&&b.cat!=="arm")||(b.cat==="leg"&&a.cat!=="arm"));

const lastOk={},counts={hop:0,clap:0};
const doing=id=>performance.now()-(lastOk[id]||-1e9)<(id==="hop"?2200:M[id].act?1700:700);
// "Tydeligt i gang": bruges kun når spilleren skal straffes for at gøre noget forbudt.
// En stilling skal holdes i 0,8 sek. i træk, og hop/klap skal ske mindst 2 gange inden for 2 sek.
// Så tæller et skævt hop-landing ikke som "stå på ét ben" eller "squat".
const okSince={},evts={hop:[],clap:[]};
const clearly=id=>{const now=performance.now();if(M[id].act)return evts[id].filter(t=>now-t<2000).length>=2;return doing(id)&&okSince[id]!=null&&now-okSince[id]>=800;};

// Hop: kroppen bevæger sig op og ned. Vi følger midten af overkroppen (skuldre + hofter)
// og tæller ét hop, hver gang den vender fra "ned" til "op" med mindst ~2 % af overkroppens længde.
// Fødderne behøver ikke være med i billedet, og små hop/vip tæller også.
let bodyS=null,goingUp=false,ext=null;
function detectHop(now){
  if(!seen(0.3,11,12,23,24))return;
  const sh=(lm[11].y+lm[12].y)/2,hip=(lm[23].y+lm[24].y)/2,torso=Math.abs(hip-sh)||0.2;
  const y=(sh+hip)/2;
  bodyS=bodyS===null?y:bodyS*0.25+y*0.75;          // let udglatning mod kamerastøj
  const A=torso*0.018;
  if(ext===null){ext=bodyS;return;}
  if(goingUp){
    if(bodyS<ext)ext=bodyS;                         // nyt toppunkt (mindre y = højere oppe)
    else if(bodyS>ext+A){goingUp=false;ext=bodyS;}  // på vej ned igen
  }else{
    if(bodyS>ext)ext=bodyS;                         // nyt bundpunkt
    else if(bodyS<ext-A){goingUp=true;ext=bodyS;counts.hop++;evts.hop.push(now);evts.hop=evts.hop.slice(-10);lastOk.hop=now;}
  }
}
// Klap: hænderne mødes efter at have været fra hinanden.
// Bruger både håndled og fingerspidser, fordi hænderne ofte bliver slørede, når de mødes.
let handsApart=true,handsHidden=0;
function detectClap(now){
  if(!seen(0.3,11,12))return;
  const sw=Math.abs(lm[11].x-lm[12].x)||0.15;
  const pts=[[15,16],[19,20],[17,18]].filter(([a,b])=>seen(0.15,a,b));
  if(!pts.length)return;
  const d=Math.min(...pts.map(([a,b])=>Math.hypot(lm[a].x-lm[b].x,lm[a].y-lm[b].y)));
  if(handsApart&&d<sw*0.6){handsApart=false;counts.clap++;evts.clap.push(now);evts.clap=evts.clap.slice(-10);lastOk.clap=now;}
  else if(!handsApart&&d>sw*0.8)handsApart=true;
}

/* ---------- Lyd og tale ---------- */
let daVoice=null;
function pickVoice(){try{
  const pre=L().speech.slice(0,2);
  const da=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith(pre));
  if(pre==="en")da.sort((a,b)=>(b.lang==="en-US")-(a.lang==="en-US"));
  const rank=x=>/premium/i.test(x.name+x.voiceURI)?3:/enhanced|forbedret/i.test(x.name+x.voiceURI)?2:x.localService?1:0;
  da.sort((a,b)=>rank(b)-rank(a));daVoice=da[0]||null;
}catch{}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch{}
/* Forindspillede Microsoft-stemmer (audio/clips.json). Findes en sætning ikke som lydfil,
   bruger vi telefonens egen oplæser som reserve. */
let ac=null;
try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch{}
let CLIPS={},bufs={},playing=[],speakId=0;
fetch("audio/clips.json").then(r=>r.json()).then(j=>{CLIPS=j;loadClips();}).catch(()=>{});
function loadClips(){
  const map=CLIPS[lang]||{};
  for(const text in map){const f=map[text];if(bufs[f])continue;bufs[f]="loading";
    fetch("audio/"+f).then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>ac.decodeAudioData(b,ok,no))).then(d=>{bufs[f]=d;}).catch(()=>{delete bufs[f];});}
}
function stopSpeech(){for(const s of playing){try{s.stop();}catch{}}playing=[];try{if(speechSynthesis.speaking)speechSynthesis.cancel();}catch{}}
function synth(t){try{
  const u=new SpeechSynthesisUtterance(t);u.lang=L().speech;if(daVoice)u.voice=daVoice;u.rate=0.95;u.pitch=1.05;u.volume=1;
  speechSynthesis.speak(u);
}catch{}}
function speak(parts){
  parts=[].concat(parts).map(s=>s.trim()).filter(Boolean);
  stopSpeech();const id=++speakId;
  const map=CLIPS[lang]||{},list=parts.map(p=>bufs[map[p]]);
  if(!ac||list.some(b=>!b||b==="loading")){synth(parts.join(" "));return;}
  let t=ac.currentTime+0.02;
  for(const b of list){const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(t);t+=b.duration+0.08;playing.push(s);}
}
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();beep(440,0.01,0.001);}catch{}}
function beep(freq,dur,vol=0.4,type="sine",at=0){if(!ac)return;try{
  const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+at;
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+dur);
}catch{}}
const sfx={good:()=>{beep(660,.15);beep(990,.25,.4,"sine",.15);},bad:()=>beep(220,.4,.5,"sawtooth")};

/* ---------- Opstart ---------- */
async function init(){
  try{
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",delegate:d},runningMode:"VIDEO",numPoses:1});
    // iPhone/Safari: GPU virker ikke altid, så vi falder tilbage til CPU
    try{pose=await PoseLandmarker.createFromOptions(fs,opts("GPU"));}catch{pose=await PoseLandmarker.createFromOptions(fs,opts("CPU"));}
    modelReady=true;$("normal").disabled=$("hard").disabled=false;$("msg").textContent="";
  }catch(e){$("msg").dataset.err=1;$("msg").textContent=L().modelErr;}
}
init();
setTimeout(applyLang,0);

let state="menu",mode="normal",score=0,lives=3,round=null,step=null,active=new Set(),vt=0,last=0,looping=false;

async function begin(m){
  // iPhone kræver, at lyd og tale startes direkte i trykket, før noget andet ventes på
  unlockAudio();
  speak(m==="hard"?L().hardIntro:L().ready);
  try{
    if(!v.srcObject){
      v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});
      await v.play();
    }
  }catch(e){$("msg").textContent=L().camErr;return;}
  mode=m;score=0;lives=3;round=step=null;active.clear();mistakes=[];$("mistakes").hidden=true;upd();$("menu").hidden=true;$("mtitle").textContent=L().title;state="play";
  if(!looping){looping=true;requestAnimationFrame(loop);}
  setTimeout(next,m==="hard"?4500:2500);
}
$("normal").onclick=()=>begin("normal");
$("hard").onclick=()=>begin("hard");

function upd(){$("score").textContent=L().points(score);$("lives").textContent="♥".repeat(Math.max(0,lives))+"♡".repeat(3-Math.max(0,lives));renderActive();}
function renderActive(){
  const box=$("active");box.textContent="";
  if(mode!=="hard")return;
  for(const id of active){const s=document.createElement("span");s.textContent=mt(M[id]);if(state==="play"&&step&&performance.now()-step.t0>step.G&&!doing(id))s.className="off";box.appendChild(s);}
}
function flash(txt,col){const f=$("flash");f.textContent=txt;f.style.color=col;f.classList.add("show");setTimeout(()=>f.classList.remove("show"),1100);}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function say(simon,text){
  $("cmd").innerHTML="";
  if(simon){const s=document.createElement("span");s.className="s";s.textContent=L().simon;$("cmd").appendChild(s);}
  $("cmd").appendChild(document.createTextNode(cap(text)+"!"));
  $("bar").style.background=simon?"var(--simon)":"var(--trap)";
  speak((simon?L().simon:"")+text);
}
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- Normal: én ting ad gangen ---------- */
// Reaktionstid: de første 0,8 sek. af en runde tæller ikke, så man når at slippe den forrige bevægelse
const REACT=800;
let prevId=null;
function nextNormal(){
  // Aldrig samme bevægelse to gange i træk: ellers "arver" runden den stilling, man allerede står i
  const m=pick(MOVES.filter(x=>x.id!==prevId)),simon=Math.random()<0.7;prevId=m.id;
  const dur=Math.max(2200,4000-score*120)+(m.act?1500:0)+REACT;
  round={m,simon,start:performance.now(),dur,done:false,c0:null};vt=0;
  say(simon,m.act?mt(m)+L().twice:mt(m));
}
function frameNormal(now,dt){
  const r=round;if(!r||r.done)return;
  const t=(now-r.start)/r.dur;$("bar").style.width=Math.min(100,t*100)+"%";
  if(now-r.start<REACT)return;
  if(r.c0===null)r.c0=r.m.act?counts[r.m.id]:0;
  let did;
  if(r.m.act)did=counts[r.m.id]-r.c0>=2;
  else{vt=lm&&r.m.ok()?vt+dt:Math.max(0,vt-dt);did=vt>400;}
  if(did)r.simon?end(true,L().good):end(false,L().notSimon);
  else if(t>=1)r.simon?end(false,L().slow):end(true,L().held);
}

/* ---------- Svær: bliv ved, til Simon siger stop ---------- */
let lastStopped=null;
function nextHard(){
  const now=performance.now();
  const free=MOVES.filter(m=>!active.has(m.id)&&[...active].every(a=>!conflict(m,M[a])));
  let kind;
  if(active.size===0)kind="add";
  else if(active.size<2&&free.length&&Math.random()<0.5)kind="add";
  else kind="stop";
  let simon=Math.random()<(active.size===0?0.8:0.72);
  let pool=free.length?free:MOVES.filter(x=>!active.has(x.id));
  // En fælde må aldrig være noget, man allerede er i gang med (fx lige efter en fejl), og ikke det sidst stoppede
  if(kind==="add"&&!simon){const fair=pool.filter(x=>!doing(x.id)&&x.id!==lastStopped);if(fair.length)pool=fair;else simon=true;}
  // Giv kombinationen klap + arme over hovedet en god chance, når den ene allerede er i gang
  const partner=active.size===1&&simon?pool.find(x=>combo(x,M[[...active][0]])):null;
  const m=kind==="add"?(partner&&Math.random()<0.5?partner:pick(pool)):M[pick([...active])];
  lastStopped=kind==="stop"&&simon?m.id:null;
  const G=Math.max(2500,4200-score*90);
  step={kind,simon,m,t0:now,G,end:now+G+3200,done:false};vt=0;
  if(simon){kind==="add"?active.add(m.id):active.delete(m.id);}
  say(simon,kind==="add"?mt(m):L().stop(ms(m)));
  renderActive();
}
function frameHard(now,dt){
  const s=step;if(!s||s.done)return;
  const t=now-s.t0;$("bar").style.width=Math.min(100,t/(s.end-s.t0)*100)+"%";
  const forbidden=(s.kind==="add"&&!s.simon)||(s.kind==="stop"&&s.simon)?s.m.id:null;
  if(t<s.G){
    if(t>REACT&&s.kind==="add"&&!s.simon&&clearly(s.m.id))return end(false,L().notSimon);
    return;
  }
  const missing=[...active].find(id=>!doing(id));
  const bad=missing||(forbidden&&clearly(forbidden));
  vt=bad?vt+dt:0;
  renderActive();
  if(vt>800){
    if(missing)return end(false,s.kind==="stop"&&!s.simon&&missing===s.m.id?L().notStop:L().stopped(ms(M[missing])));
    return end(false,s.simon?L().shouldStop(ms(s.m)):L().notSimon);
  }
  if(now>=s.end)end(true,pick(L().praise));
}

/* ---------- Fælles ---------- */
function next(){if(state!=="play")return;mode==="hard"?nextHard():nextNormal();}
let mistakes=[];
function logMistake(txt){
  const r=mode==="hard"?step:round;
  const cmd=(r.simon?L().simon:"")+(mode==="hard"&&r.kind==="stop"?L().stop(ms(r.m)):mt(r.m));
  const also=mode==="hard"&&active.size?L().also+[...active].map(id=>mt(M[id])).join(" + "):"";
  mistakes.push({cmd:cap(cmd),why:txt,also});
}
function showMistakes(){
  const ol=$("mistakes");ol.textContent="";
  for(const m of mistakes){
    const li=document.createElement("li"),b=document.createElement("b"),s=document.createElement("span");
    b.textContent="“"+m.cmd+"”";s.textContent=m.why+(m.also?" "+m.also+".":"");
    li.append(b,s);ol.appendChild(li);
  }
  ol.hidden=!mistakes.length;
}
function end(success,txt){
  (mode==="hard"?step:round).done=true;
  if(success){score++;flash(txt,"var(--ok)");sfx.good();}
  else{lives--;flash(txt,"var(--trap)");sfx.bad();logMistake(txt);if(mode==="hard")active.clear();}
  upd();
  if(lives<=0){
    state="menu";
    setTimeout(()=>speak([L().overShort+".",L().got(score)]),400);
    setTimeout(()=>{$("menu").hidden=false;$("mtitle").textContent=score+" point!";showMistakes();$("cmd").textContent=L().overShort;},1200);
    return;
  }
  if(!success)setTimeout(()=>speak(mode==="hard"?[txt,L().restart]:txt),350);
  setTimeout(next,success?(mode==="hard"?600:1300):(mode==="hard"?3200:2300));
}

function loop(now){
  if(v.readyState>=2&&pose){
    if(c.width!==v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;}
    const r=pose.detectForVideo(v,now);
    lm=r.landmarks&&r.landmarks[0]||null;
    ctx.clearRect(0,0,c.width,c.height);
    if(lm){
      const d=new DrawingUtils(ctx);d.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:"#ffc83d",lineWidth:4});d.drawLandmarks(lm,{color:"#f6f3ff",radius:3});
      for(const m of MOVES)if(m.ok){if(m.ok()){if(okSince[m.id]==null)okSince[m.id]=now;lastOk[m.id]=now;}else if(now-(lastOk[m.id]||0)>150)okSince[m.id]=null;}
      detectHop(now);detectClap(now);
    }
    // Lille live-visning, så man kan se hvad kameraet fanger
    $("live").textContent=lm?L().live(counts.hop,counts.clap,doing("squat")?"✓":"–"):L().noSee;
    const dt=now-(last||now);
    if(state==="play")mode==="hard"?frameHard(now,dt):frameNormal(now,dt);
  }
  last=now;
  requestAnimationFrame(loop);
}
